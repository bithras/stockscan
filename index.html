<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<title>Σαρωτής παραλαβών</title>
<style>
  :root { --bg:#14161a; --panel:#1f2329; --line:#323843; --text:#eef1f5; --muted:#9aa3b0;
          --accent:#3b82f6; --ok:#22c55e; --warn:#f59e0b; --err:#ef4444; }
  * { box-sizing:border-box; }
  html,body { margin:0; background:var(--bg); color:var(--text);
              font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  body { padding:12px 16px 40px; max-width:560px; margin:0 auto; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  h1 { font-size:20px; margin:0; }
  h2 { font-size:14px; color:var(--muted); font-weight:600; margin:18px 0 6px; text-transform:uppercase; letter-spacing:.04em; }
  button { font:inherit; border:0; border-radius:10px; padding:12px 16px; background:var(--accent); color:#fff; font-weight:600; cursor:pointer; }
  button.ghost { background:transparent; border:1px solid var(--line); color:var(--text); }
  button:disabled { opacity:.5; }
  input { font:inherit; width:100%; padding:12px; border-radius:10px; border:1px solid var(--line); background:#0f1114; color:var(--text); }
  label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:14px; margin-top:12px; }
  #cam { position:relative; background:#000; border-radius:14px; overflow:hidden; aspect-ratio:4/3; max-height:42vh; width:100%; }
  #cam video { width:100%; height:100%; object-fit:cover; display:block; }
  #cam .frame { position:absolute; inset:28% 10%; border:2px solid rgba(255,255,255,.7); border-radius:10px; pointer-events:none; }
  #cam.hit .frame { border-color:var(--ok); box-shadow:0 0 0 9999px rgba(34,197,94,.15); }
  #cam.paused::after { content:"Σάρωση σε παύση"; position:absolute; inset:auto 0 10px; text-align:center; font-size:13px; color:#fff; }
  #camStart { position:absolute; inset:0; display:flex; flex-direction:column; gap:10px; align-items:center; justify-content:center; padding:16px; text-align:center; }
  #camMsg { color:var(--muted); font-size:14px; }
  .row { display:flex; gap:8px; }
  .row input { flex:1; }
  #status { min-height:24px; margin-top:10px; font-size:15px; }
  #status.ok { color:var(--ok); } #status.warn { color:var(--warn); } #status.err { color:var(--err); }
  .pname { font-size:20px; font-weight:700; margin:0 0 2px; }
  .meta { color:var(--muted); font-size:13px; word-break:break-all; }
  .qty { display:flex; gap:8px; align-items:center; margin-top:12px; }
  .qty input { font-size:28px; font-weight:700; text-align:center; width:110px; flex:none; padding:8px; }
  .qty button { flex:1; }
  .badge { display:inline-block; font-size:13px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--ok); color:#06210f; margin-left:6px; vertical-align:middle; }
  ul { list-style:none; margin:0; padding:0; }
  #recent li { display:flex; justify-content:space-between; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line); cursor:pointer; }
  #recent li span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #recent li b { flex:none; }
  dialog { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:14px; width:min(92vw,480px); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>Παραλαβή προϊόντων</h1>
  <button class="ghost" id="btnSettings" aria-label="Ρυθμίσεις">⚙</button>
</header>

<div id="cam">
  <video id="video" playsinline muted></video>
  <div class="frame"></div>
  <div id="camStart">
    <button id="btnCam">Άνοιγμα κάμερας</button>
    <div id="camMsg"></div>
  </div>
</div>

<form id="manual" class="row" style="margin-top:10px" autocomplete="off">
  <input id="manualCode" inputmode="numeric" placeholder="ή πληκτρολόγησε barcode">
  <button>OK</button>
</form>

<div id="status"></div>

<section id="card" class="panel" hidden>
  <p class="pname" id="cName"></p>
  <div class="meta" id="cMeta"></div>
  <form class="qty" id="qtyForm">
    <input id="cQty" type="number" inputmode="numeric" min="0" step="1">
    <button>Ορισμός ποσότητας</button>
  </form>
</section>

<section id="newForm" class="panel" hidden>
  <p class="pname">Νέο barcode</p>
  <div class="meta" id="nCode"></div>
  <form id="createForm" autocomplete="off">
    <label for="nName">Όνομα προϊόντος</label>
    <input id="nName" required>
    <label for="nSku">SKU (προαιρετικό)</label>
    <input id="nSku">
    <div class="row" style="margin-top:12px">
      <button style="flex:1">Αποθήκευση (ποσ. 1)</button>
      <button type="button" class="ghost" id="btnCancel">Άκυρο</button>
    </div>
  </form>
</section>

<h2>Τελευταίες σαρώσεις</h2>
<ul id="recent"></ul>

<dialog id="settings">
  <form method="dialog" id="settingsForm">
    <p class="pname">Ρυθμίσεις</p>
    <label for="sUrl">Διεύθυνση Web app (Apps Script)</label>
    <input id="sUrl" placeholder="https://script.google.com/macros/s/…/exec">
    <label for="sKey">Κλειδί εφαρμογής</label>
    <input id="sKey">
    <div class="row" style="margin-top:14px">
      <button style="flex:1" value="save">Αποθήκευση & έλεγχος</button>
      <button class="ghost" value="cancel" formnovalidate>Κλείσιμο</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  const MOCK = new URLSearchParams(location.search).has('mock');

  // One-time setup link: …/#url=<web app url>&key=<key>
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('url') && h.get('key')) {
    store.set('cfg', { url: h.get('url'), key: h.get('key') });
    history.replaceState(null, '', location.pathname + location.search);
  }
  let cfg = store.get('cfg', null);

  // ---------- API (requests run one after another, in scan order) ----------
  let chain = Promise.resolve();
  function api(action, data) {
    const p = chain.then(() => call(action, data || {}));
    chain = p.catch(() => {});
    return p;
  }
  async function call(action, data) {
    if (MOCK) return mock(action, data);
    if (!cfg || !cfg.url || !cfg.key) throw new Error('Λείπουν οι ρυθμίσεις — πάτα ⚙');
    let r;
    try {
      r = await fetch(cfg.url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                                 body: JSON.stringify(Object.assign({ key: cfg.key, action }, data)) });
    } catch (e) { throw new Error('Χωρίς σύνδεση — ΔΕΝ καταγράφηκε, σάρωσε ξανά'); }
    let j;
    try { j = await r.json(); } catch (e) { throw new Error('Μη έγκυρη απάντηση από το Sheet (έλεγξε τη διεύθυνση)'); }
    if (!j.ok) throw new Error(j.error || 'Σφάλμα');
    return j;
  }

  // ---------- UI helpers ----------
  function status(msg, kind) { const s = $('status'); s.textContent = msg || ''; s.className = kind || ''; }
  let audio;
  function beep(ok) {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      const o = audio.createOscillator(), g = audio.createGain();
      o.frequency.value = ok ? 1400 : 300; g.gain.value = 0.15;
      o.connect(g); g.connect(audio.destination); o.start(); o.stop(audio.currentTime + (ok ? 0.08 : 0.35));
    } catch (e) {}
    try { navigator.vibrate && navigator.vibrate(ok ? 60 : [120, 60, 120]); } catch (e) {}
  }

  let current = null;
  function showCard(p, badge) {
    current = p;
    $('newForm').hidden = true; $('card').hidden = false;
    $('cName').innerHTML = '';
    $('cName').append(p.name || '(χωρίς όνομα)');
    if (badge) { const b = document.createElement('span'); b.className = 'badge'; b.textContent = badge; $('cName').append(b); }
    $('cMeta').textContent = p.barcode + (p.sku ? ' · SKU ' + p.sku : '');
    $('cQty').value = p.qty;
    addRecent(p);
  }

  function addRecent(p) {
    const list = store.get('recent', []).filter(x => x.barcode !== p.barcode);
    list.unshift({ barcode: p.barcode, name: p.name, qty: p.qty });
    store.set('recent', list.slice(0, 15));
    renderRecent();
  }
  function renderRecent() {
    const ul = $('recent'); ul.innerHTML = '';
    for (const x of store.get('recent', [])) {
      const li = document.createElement('li');
      const a = document.createElement('span'); a.textContent = x.name || x.barcode;
      const b = document.createElement('b'); b.textContent = x.qty;
      li.append(a, b);
      li.onclick = () => openExisting(x.barcode);
      ul.append(li);
    }
  }

  async function openExisting(barcode) {
    status('Φόρτωση…');
    try {
      const j = await api('get', { barcode });
      if (j.unknown) { status('Δεν υπάρχει πια στο Sheet', 'warn'); return; }
      showCard(j.product); status('');
    } catch (e) { status(e.message, 'err'); }
  }

  // ---------- scanning flow ----------
  let paused = false;
  let last = { code: null, seen: 0 };

  async function onCode(raw, format) {
    if (!MOCK && (!cfg || !cfg.url || !cfg.key)) {
      beep(false); status('Διαβάστηκε ' + raw + ' — αλλά λείπουν οι ρυθμίσεις του Sheet (πάτα ⚙ ή άνοιξε τον σύνδεσμο ρύθμισης)', 'err');
      return;
    }
    beep(true);
    flash();
    status('Καταγραφή ' + raw + '…');
    try {
      const j = await api('scan', { barcode: raw, format });
      if (j.unknown) { showNew(j); status(j.warning || 'Νέο barcode — συμπλήρωσε όνομα', j.warning ? 'warn' : ''); return; }
      showCard(j.product, '+1');
      status(j.warning || ('+1 → ' + j.product.qty), j.warning ? 'warn' : 'ok');
    } catch (e) {
      // Keep last.code: the same code fires again only after it leaves the view (no beep loop on errors).
      beep(false); status(raw + ': ' + e.message, 'err');
    }
  }

  function showNew(j) {
    paused = true; $('cam').classList.add('paused');
    $('card').hidden = true; $('newForm').hidden = false;
    $('nCode').textContent = j.barcode;
    $('newForm').dataset.barcode = j.barcode;
    $('nName').value = j.hint || '';
    $('nSku').value = '';
    $('nName').focus();
  }
  function closeNew() {
    $('newForm').hidden = true;
    paused = false; $('cam').classList.remove('paused');
  }

  $('createForm').onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('button'); btn.disabled = true;
    try {
      const j = await api('create', { barcode: $('newForm').dataset.barcode, name: $('nName').value, sku: $('nSku').value, qty: 1 });
      closeNew(); showCard(j.product, j.created ? 'νέο' : '+1');
      status(j.note || ('Αποθηκεύτηκε, ποσ. ' + j.product.qty), j.note ? 'warn' : 'ok');
    } catch (e) { status(e.message, 'err'); }
    btn.disabled = false;
  };
  $('btnCancel').onclick = () => { closeNew(); status('Ακυρώθηκε — δεν καταγράφηκε'); };

  $('qtyForm').onsubmit = async ev => {
    ev.preventDefault();
    if (!current) return;
    const n = $('cQty').value.trim();
    if (!/^\d+$/.test(n)) { status('Γράψε ακέραιο αριθμό', 'err'); return; }
    $('cQty').blur();
    try {
      const j = await api('setQty', { barcode: current.barcode, qty: Number(n) });
      showCard(j.product); status('Ποσότητα = ' + j.product.qty, 'ok');
    } catch (e) { status(e.message, 'err'); }
  };

  $('manual').onsubmit = ev => {
    ev.preventDefault();
    const v = $('manualCode').value.trim();
    if (!v) return;
    $('manualCode').value = '';
    onCode(v, 'manual');
  };

  function flash() { const c = $('cam'); c.classList.add('hit'); setTimeout(() => c.classList.remove('hit'), 250); }

  // ---------- camera ----------
  const video = $('video');
  async function startCam() {
    if (!('BarcodeDetector' in window)) {
      $('camMsg').textContent = 'Αυτός ο browser δεν διαβάζει barcode από την κάμερα. Χρησιμοποίησε Chrome σε Android ή πληκτρολόγησε τον κωδικό.';
      return;
    }
    try {
      const wanted = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'];
      const formats = (await BarcodeDetector.getSupportedFormats()).filter(f => wanted.includes(f));
      const detector = new BarcodeDetector({ formats });
      const stream = await navigator.mediaDevices.getUserMedia({ audio: false,
        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
      video.srcObject = stream; await video.play();
      $('camStart').hidden = true;
      loop(detector);
    } catch (e) {
      $('camMsg').textContent = 'Η κάμερα δεν άνοιξε: ' + (e.message || e);
    }
  }
  async function loop(detector) {
    if (video.readyState >= 2 && !document.hidden) {
      try {
        const codes = await detector.detect(video);
        if (codes.length) {
          const c = codes[0], now = Date.now();
          // Same code counts again only after it has been out of view for 1.2 s.
          const fresh = c.rawValue !== last.code || now - last.seen > 1200;
          last.seen = now;
          if (fresh) { last.code = c.rawValue; if (!paused) onCode(c.rawValue, c.format); }
        }
      } catch (e) {}
    }
    setTimeout(() => loop(detector), 120);
  }
  $('btnCam').onclick = () => { beep(true); startCam(); };

  // ---------- settings ----------
  $('btnSettings').onclick = () => {
    $('sUrl').value = (cfg && cfg.url) || ''; $('sKey').value = (cfg && cfg.key) || '';
    $('settings').showModal();
  };
  $('settings').addEventListener('close', async () => {
    if ($('settings').returnValue !== 'save') return;
    cfg = { url: $('sUrl').value.trim(), key: $('sKey').value.trim() };
    store.set('cfg', cfg);
    status('Έλεγχος σύνδεσης…');
    try { await api('ping'); status('Συνδέθηκε με το Sheet ✓', 'ok'); }
    catch (e) { status(e.message, 'err'); }
  });

  // ---------- local test backend (?mock) ----------
  const db = {};
  function mock(action, d) {
    return new Promise(res => setTimeout(() => {
      if (action === 'ping') return res({ ok: true });
      let code = String(d.barcode).trim(); if (/^\d{12}$/.test(code)) code = '0' + code;
      const p = db[code];
      if (action === 'scan') { if (!p) return res({ ok: true, unknown: true, barcode: code, hint: code === '0019954151232' ? "D'Addario EXL170 Bass XL Set 45-100 Long" : '' }); p.qty++; return res({ ok: true, product: { ...p } }); }
      if (action === 'get') return res(p ? { ok: true, product: { ...p } } : { ok: true, unknown: true, barcode: code });
      if (action === 'create') { db[code] = { barcode: code, name: d.name, sku: d.sku, qty: d.qty }; return res({ ok: true, created: true, product: { ...db[code] } }); }
      if (action === 'setQty') { p.qty = d.qty; return res({ ok: true, product: { ...p } }); }
    }, 150));
  }

  renderRecent();
  if (!cfg && !MOCK) status('Πρώτη φορά: άνοιξε τον σύνδεσμο ρύθμισης ή πάτα ⚙', 'warn');
})();
</script>
</body>
</html>
